[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "sapio-lims-webhooks"
version = "0.1.0"
description = "Custom Python webhooks for Sapio LIMS — LIMS Consulting Team"
requires-python = ">=3.11"
dependencies = [
    "sapio-saas-api>=3.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1.0",
    "mypy>=1.5",
    "types-requests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=webhooks --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["webhooks"]
omit = ["tests/*"]
