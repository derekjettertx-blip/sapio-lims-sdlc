            items:
              type: string
              description: A set of data type names that should be hidden from the
                Link Panel.
          linkPanelAlwaysShownDataTypeNames:
            uniqueItems: true
            type: array
            description: "A set of data type names that should always be shown in\
              \ the Link Panel, even if they have no related records."
            items:
              type: string
              description: "A set of data type names that should always be shown in\
                \ the Link Panel, even if they have no related records."
    PlanStatusViewComponentPojo:
      required:
      - column
      - columnSpan
      - componentName
      - order
      - pluginPath
      type: object
      description: A component that displays details about the current status of a
        plan.
      allOf:
      - $ref: "#/components/schemas/DataTypeComponentPojo"
      - type: object
        properties:
          pluginPath:
            type: string
            description: The fully qualified plugin pass that will be executed to
