        field.  The values returned for fields of this type will be short values that
        index into the array of values set on the field definition.
      allOf:
      - $ref: "#/components/schemas/VeloxFieldDefinitionPojo"
      - type: object
        properties:
          dependentFieldMap:
            type: object
            additionalProperties:
              uniqueItems: true
              type: array
              description: A map of field name to the field values that cause that
                dependent field to become disabled.
              items:
                type: integer
                description: A map of field name to the field values that cause that
                  dependent field to become disabled.
                format: int32
            description: A map of field name to the field values that cause that dependent
              field to become disabled.
          defaultValue:
            type: integer
