            format: int32
          uniqueValue:
            type: boolean
            description: "Whether this field must be unique in the system.  If this\
              \ field is set to true after records are already created, it is possible\
              \ for duplicate values to exist in the system.  Additionally if no value\
              \ is provided to this field when setting fields, the uniqueness will\
              \ not be validated."
          fieldValidator:
            $ref: "#/components/schemas/FieldValidatorPojo"
          iconName:
            type: string
            description: The name of the icon displayed in the button.
          actionPluginPath:
            type: string
            description: The path to the plugin descriptor that will be invoked when
              the button displayed with this field is clicked.
          directEdit:
            type: boolean
            description: Whether to allow direct edit on this field or force them
              to use the plugin.
    VeloxChildLinkFieldDefinitionPojo:
