
openapi: 3.0.0
info:
  title: Sapio Web Service
  description: "This is the Web Service for storing and retrieving data in the Sapio\
    \ Informatics Platform.\n  \nTo easily use this web service in Python, follow\
    \ this tutorial: https://github.com/sapiosciences/sapio-py-tutorials\n\n## Common\
    \ Headers\nThe following headers are valid for all endpoints:\n| Header | Description\
    \ |\n| --- | --- |\n| **X-APP-KEY** | The GUID that is assigned to the app the\
    \ endpoint is to connect to. This is required when multiple apps are hosted on\
    \ the same domain |\n| **X-USER-GROUP** | An optional header to specify the User\
    \ Group Name that should be used when performing the API operation. Only Groups\
    \ that the connecting User is assigned to can be used otherwise the header will\
    \ be ignored and the default User Group will be used |\n"
  contact:
    email: support@sapiosciences.com
  version: 2025.12.22.0247-1157-25_9_1
  x-logo:
    url: /webservice/documentation/sapio.png
    backgroundColor: "#FFFFFF"
    altText: Sapio logo
servers:
- url: /webservice/api
security:
- ApiToken: []
- BasicAuth: []
- Bearer: []
tags:
- name: DataRecords
  description: Endpoints for getting and manipulating DataRecords in the system without
    considering their relations to other records.
  x-displayName: Data Records Without Relations
- name: ELN
  description: "Endpoints for manipulating electronic notebooks in the system, and\
    \ their associated records."
  x-displayName: Electronic Notebook
- name: PickList
  description: "Endpoints for Getting existing pick lists, Create or update pick list\
    \ values."
  x-displayName: Pick List Management
- name: Attachments
  description: Endpoints for getting and setting files set on DataRecords in the system.
  x-displayName: Records With File Data
- name: CustomReport
  description: Endpoints for running custom reports.
  x-displayName: Custom Report
- name: AccessionService
  description: Accession a list of contiguous and unique identifiers given a criteria.
    Uniqueness is on per key basis.
  x-displayName: Accession Service
- name: Ancestors
  description: Get ancestors of one or more records.
  x-displayName: Ancestors
- name: Descendants
  description: Get descendants of one or more records.
  x-displayName: Descendants
- name: Parents
  description: Get parents of one or more records.
  x-displayName: Parents
- name: Children
  description: "Get, link, or create children of one or more records."
  x-displayName: Children
- name: Access
  description: Manage access for records.
  x-displayName: Access
- name: DataTypeManager
  description: Endpoints for getting information about the data types and fields in
    the system.  These methods can be used to get information about the structure
    of how the data is stored to be used with retrieving and modifying DataRecords.
  x-displayName: Data Type Management
- name: Report
  description: Endpoints for retrieving Report Templates and their entries as well
    as generating Report PDFs in the system.
  x-displayName: Report Template Management
- name: Email
  description: Endpoints for sending emails through the Sapio Platform.
  x-displayName: Email Management
- name: Message
  description: Endpoints for sending system messages to users within the Sapio Platform.
  x-displayName: Message Management
- name: ClientCallback
  description: "Endpoints for interacting with the current user in the Sapio Platform.\
    \  These endpoints can only be used with the credentials provided in a webhook's\
    \ context.  Also, if the webhook context says that client callback is not currently\
    \ supported then those methods will not work either."
  x-displayName: Client Callback
- name: LlmManagement
  description: Endpoints for configuring LLM models and sending chat/tokens requests
    through the Sapio Platform.
  x-displayName: LLM Management
- name: External Credential
  description: Endpoints for retrieving and managing external credentials necessary
    to connect to external systems related to the Sapio Platform.
  x-displayName: External Credential Management
paths:
  /accession/accessionForField:
    post:
      tags:
      - AccessionService
      summary: Accession IDs for Field
      description: "Accession IDs. If this is the first time, look up starting value\
        \ to be greater than the maximum of existing ID (+1).User do not need to worry\
        \ about ACL. However the field must be unique."
      operationId: accessionForField_1
      parameters:
      - name: numToAccession
        in: query
        description: Number of IDs to return
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        description: The rules on how an ID should be generated.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessionDataFieldCriteriaPojo"
        required: true
      responses:
        "200":
          description: List of IDs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidParam"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServerUnavailable"
  /accession/accessionForSystem:
    post:
      tags:
      - AccessionService
      summary: Accession IDs
      description: Accession IDs that do not need to get starting value from a data
        field.
      operationId: accessionForSystem_1
      parameters:
      - name: numToAccession
        in: query
        description: Number of IDs to return
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        description: The rules on how an ID should be generated.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessionSystemCriteriaPojo"
        required: true
      responses:
        "200":
          description: List of IDs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidParam"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServerUnavailable"
  /agent/activate:
    post:
      tags:
      - AgentManagement
      summary: Activate Agent Configs
      description: Activate one or more agent configurations
      operationId: activateAgentConfigs_1
      requestBody:
        description: List of version IDs to activate
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/VersionId"
        required: true
      responses:
        "200":
          description: Successfully activated agent configs
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidParam"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServerUnavailable"
  /agent/deactivate:
    post:
      tags:
      - AgentManagement
      summary: Deactivate Agent Configs
      description: Deactivate one or more agent configurations
      operationId: deactivateAgentConfigs_1
      requestBody:
        description: List of version IDs to deactivate
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/VersionId"
        required: true
      responses:
        "200":
          description: Successfully deactivated agent configs
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidParam"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServerUnavailable"
  /agent/delete:
    post:
      tags:
      - AgentManagement
      summary: Delete Agent Configs
      description: Delete one or more agent configurations
      operationId: deleteAgentConfigs_1
      requestBody:
        description: List of version IDs to delete
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/VersionId"
        required: true
      responses:
        "204":
          description: Successfully deleted agent configs
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidParam"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServerUnavailable"
  /agent/categories:
    get:
      tags:
      - AgentManagement
      summary: Get Agent Category Library
      description: Retrieve list of available agent categories
      operationId: getAgentCategoryLibrary_1
      responses:
        "200":
          description: Successfully retrieved category library
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServerUnavailable"
  /agent/{id}/{version}:
    get:
      tags:
      - AgentManagement
      summary: Get Agent Config
      description: Retrieve a complete agent configuration by ID and version
      operationId: getAgentConfig_1
      parameters:
      - name: id
        in: path
        description: The UUID of the agent config
        required: true
        schema:
          type: string
      - name: version
        in: path
        description: The version of the agent config
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: Successfully retrieved agent config
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServerUnavailable"
  /agent/infos:
    get:
      tags:
      - AgentManagement
      summary: Get Agent Config Infos
      description: Retrieve a list of agent configuration information objects
      operationId: getAgentConfigInfos_1
      parameters:
      - name: activeOnly
        in: query
        description: Whether to return only active agent configs
        required: true
        schema:
          type: boolean
      responses:
        "200":
          description: Successfully retrieved agent config infos
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServerUnavailable"
  /agent/retrieve:
    get:
      tags:
      - AgentManagement
      summary: Retrieve Defined Agent Configs
      description: Retrieve agent configurations defined at a given URL
      operationId: retrieveDefinedAgentConfigs_1
      parameters:
      - name: url
        in: query
        description: The URL to retrieve agent configs from
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Successfully retrieved agent configs
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServerUnavailable"
  /agent/draft:
    post:
      tags:
      - AgentManagement
      summary: Store Draft Agent Config
      description: Store an agent configuration as a draft
      operationId: storeDraftAgentConfig_1
      requestBody:
        description: The agent config to store as a draft
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentConfig"
        required: true
      responses:
        "200":
          description: Successfully stored draft agent config
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidParam"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServerUnavailable"
  /agent/final:
    post:
      tags:
      - AgentManagement
      summary: Store Final Agent Config
      description: Store an agent configuration as final/published version
      operationId: storeFinalAgentConfig_1
      requestBody:
        description: The agent config to store as final
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentConfig"
        required: true
      responses:
        "200":
          description: Successfully stored final agent config
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidParam"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServerUnavailable"
  /llm/chat/{modelId}/tokens:
    post:
      tags:
      - LlmManagement
      summary: Count Tokens
      description: Count the number of tokens in a chat input
      operationId: countTokens_1
      parameters:
      - name: modelId
        in: path
        description: The ID of the model
        required: true
        schema:
          type: string
      requestBody:
        description: Chat input parameters
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LlmChatInput"
        required: true
      responses:
        "200":
          description: Successfully counted tokens
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServerUnavailable"
  /llm/chat/{modelId}/format-code:
    post:
      tags:
      - LlmManagement
      summary: Format Code
      description: Format a code snippet using the LLM
      operationId: formatCodeAnswer_1
      parameters:
      - name: modelId
        in: path
        description: The ID of the model
        required: true
        schema:
          type: string
      requestBody:
        description: The code snippet to format
        content:
          text/plain:
            schema:
              type: string
        required: true
      responses:
        "200":
          description: Successfully formatted code
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServerUnavailable"
  /llm/models:
    get:
      tags:
      - LlmManagement
      summary: Get Available Models
      description: Retrieve a list of available LLM model identifiers
      operationId: getAvailableModels_1
      responses:
        "200":
          description: Successfully retrieved model list
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServerUnavailable"
  /llm/chat/{modelId}/answer:
    post:
      tags:
      - LlmManagement
      summary: Get LLM Answer
      description: Get a direct text answer from the LLM
      operationId: getLlmAnswer_1
      parameters:
      - name: modelId
        in: path
        description: The ID of the model
        required: true
        schema:
          type: string
      requestBody:
        description: Chat input parameters
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LlmChatInput"
        required: true
      responses:
        "200":
          description: Successfully received answer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServerUnavailable"
  /llm/chat/{modelId}/send:
    post:
      tags:
      - LlmManagement
      summary: Send Chat Message
      description: Send a message to an LLM model and receive a response
      operationId: sendChat_1
      parameters:
      - name: modelId
        in: path
        description: The ID of the model to chat with
        required: true
        schema:
          type: string
      requestBody:
        description: Chat input parameters
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LlmChatInput"
        required: true
      responses:
        "200":
          description: Successfully received chat response
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServerUnavailable"
  /clientcallback/display/error:
    post:
      tags:
      - ClientCallback
      summary: Display Error
      description: Displays the provided error to the current user in a dialog.  This
        method is only available when using the credentials provided in the context
        of a webhook endpoint.
      operationId: displayError_1
      requestBody:
        description: The message to display to the user as an error.
        content:
          application/json:
            schema:
              type: string
        required: true
      responses:
        "204":
          description: Status 204 indicates that the error was displayed successfully.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidParam"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServerUnavailable"
  /clientcallback/display/info:
    post:
      tags:
      - ClientCallback
      summary: Display Info
      description: Displays the provided method to the current user in a dialog.  This
        method is only available when using the credentials provided in the context
        of a webhook endpoint.
      operationId: displayInfo_1
      requestBody:
        description: The message to display to the user.
        content:
          application/json:
            schema:
              type: string
        required: true
      responses:
        "204":
          description: Status 204 indicates that the message was displayed successfully.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidParam"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServerUnavailable"
  /clientcallback/display/popup:
    post:
      tags:
      - ClientCallback
      summary: Display Popup
      description: Display the supplied title and message in a pop-up to provide information
        that does not require user action.
      operationId: displayPopup_1
      requestBody:
        description: The request object containing the title and message to be displayed
          in the popup.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisplayPopupRequest"
        required: true
      responses:
        "204":
          description: Status 204 indicates that the popup was displayed successfully.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidParam"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServerUnavailable"
  /clientcallback/display/warning:
    post:
      tags:
      - ClientCallback
      summary: Display Warning
      description: Displays the provided warning to the current user in a dialog.  This
        method is only available when using the credentials provided in the context
        of a webhook endpoint.
      operationId: displayWarning_1
      requestBody:
        description: The message to display to the user as a warning.
        content:
          application/json:
            schema:
              type: string
        required: true
      responses:
        "204":
          description: Status 204 indicates that the warning was displayed successfully.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidParam"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServerUnavailable"
  /clientcallback/getClickCount:
    get:
      tags:
      - ClientCallback
      summary: Get Click Count
      description: Returns the current click count of the client.
      operationId: getClickCount_1
      responses:
        "200":
          description: The current click count of the client will be returned.
          content:
            application/json:
              schema:
                type: integer
                format: int32
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidParam"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServerUnavailable"
  /clientcallback/file:
    get:
      tags:
      - ClientCallback
      summary: Get File
      description: Retrieve file data using the file path retrieved from the Show
        Multi-File Dialog method.  This method is only available when using the credentials
        provided in the context of a webhook endpoint.
      operationId: getFile_1
      parameters:
      - name: filePath
        in: query
        description: The file path to retrieve the file data from.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The file data from the provided filePath will be returned.  Status
            200 indicates that the file data was retrieved successfully.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidParam"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServerUnavailable"
  /clientcallback/resetClickCount:
    post:
      tags:
      - ClientCallback
      summary: Reset Click Count
      description: Resets the client's click count back to zero.
      operationId: resetClickCount_1
      responses:
        "204":
          description: Status 204 indicates that the click count was reset successfully.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidParam"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServerUnavailable"
  /clientcallback/sendfile:
    post:
      tags:
      - ClientCallback
      summary: Send File
      description: Send a file to the user in the system that invoked the webhook.  This
        method is only available when using the credentials provided in the context
        of a webhook endpoint.
      operationId: sendFile_1
      parameters:
      - name: defaultFileName
        in: query
        description: The default name of the file being sent.
        required: true
        schema:
          type: string
      - name: requestFileName
        in: query
        description: Whether the callback should ask the user to provide a file name
          for the sent file.  Defaults to false.
        schema:
          type: boolean
      requestBody:
        description: The file stream to send to the user.
        content:
          application/octet-stream:
            schema:
              type: object
        required: true
      responses:
        "204":
          description: Status 204 indicates that the file was sent successfully.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidParam"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServerUnavailable"
  /clientcallback/dataRecordFormViewDialog:
    post:
      tags:
      - ClientCallback
      summary: Data Record Dialog
      description: Show a dialog with the specified title.  The dialog will display
        the given dataRecord using the provided DataTypeLayout.  This dialog can display
        all normal record toolbar buttons including save and cancel.  Use this when
        it is safe for the user transaction to be committed or rolled back. This method
        is only available when using the credentials provided in the context of a
        webhook endpoint.
      operationId: showDataRecordFormViewDialog_1
      requestBody:
        description: The criteria object that defines how this dialog will be displayed.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataRecordDialogRequest"
        required: true
      responses:
        "200":
          description: Status 200 indicates that the dialog was displayed successfully.
          content:
            application/json:
              schema:
                type: boolean
        "204":
          description: User has cancelled the dialog.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidParam"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServerUnavailable"
  /clientcallback/showESignDialog:
    post:
      tags:
      - ClientCallback
      summary: Data Record Query Dialog
      description: |-
        Asks the user to fill and E-sign a form. No other actions will be performed besides returning the raw interaction result object back to the caller.It is up to the caller to determine what to do next based on the signing results.
        If a ELN payload is added, then the notebook being e-signed will cause a store and commit to initiate immediately for purpose of snapshot, without waiting for the end of webhook connection.
        Note: a result object will be provided to you even if 1) the user who have signed the form is not the original session user and 2) the user had failed validation such as username/password.
      operationId: showESignatureDialog_1
      requestBody:
        content:
