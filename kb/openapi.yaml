              in the client.
            enum:
            - CURRENCY
            - PERCENTAGE
          scientificNotationMinDigitsFromDecimalPoint:
            type: integer
            description: "The minimum number of digits that must be specified in a\
              \ field value before it is displayed as scientific notation. To make\
              \ sure a field displays in scientific notation, this value and precision\
              \ must not be null."
            format: int32
