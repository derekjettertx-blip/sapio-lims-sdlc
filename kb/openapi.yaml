      - $ref: "#/components/schemas/ReportEntryDataContextPojo"
      - type: object
        properties:
          dataTypeName:
            type: string
            description: "The data type name of the record that will be used to get\
              \ the static text to display. \nThis value cannot be modified.  This\
              \ field is just to provide information about how the entry is configured\
              \ in the system.  This value must be set in order to set the dataRecordId\
              \ attribute.  If the staticTimestamp attribute is specified, then this\
              \ value will be ignored."
          dataFieldName:
            type: string
            description: "The data field name that the text value will be retrieved\
              \ from on the dataTypeName. \nThis value cannot be modified.  This field\
              \ is just to provide information about how the entry is configured in\
              \ the system.  This value must be set in order to set the dataRecordId\
              \ attribute.  If the staticTimestamp attribute is specified, then this\n\
              value will be ignored."
          dataRecordId:
            type: integer
            description: |-
              The record ID of the data record that the date will be retrieved from.
              If the staticTimestamp attribute is specified, then this value will be ignored.
            format: int64
          staticTimestamp:
            type: integer
            description: |-
              The timestamp that represents the date that should be displayed in this entry.
              This value will take precedence over the dataRecordId.
            format: int64
