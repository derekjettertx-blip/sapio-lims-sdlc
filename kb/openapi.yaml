          type: string
          enum:
          - Ignore Missing Values
          - Treat Missing Values as 0
        showStdDev:
          type: boolean
        pivotFormulaMap:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/FormulaCriteriaPojo"
      description: "The criteria for pivoting the report. If not specified, the report\
        \ can not be pivoted."
    RawReportTermPojo:
      required:
      - dataFieldName
      - dataTypeName
      - termOperation
      type: object
      description: A raw report term describes an operation to be performed on result
        data.
      allOf:
      - $ref: "#/components/schemas/ReportTermPojo"
      - type: object
        properties:
          dataTypeName:
            type: string
            description: "The data type name the term's condition is about. Each data\
              \ type to be joined together should have at least one term, even if\
              \ there is no filter other than by join condition."
          dataFieldName:
            type: string
            description: The data field name the term's condition is about.
          termOperation:
            type: string
            description: Describes what operations can be performed on rows of data
              directly.
            enum:
            - GREATER_THAN_OPERATOR
            - LESS_THAN_OPERATOR
            - EQUAL_TO_OPERATOR
            - NOT_EQUAL_TO_OPERATOR
            - GREATER_THAN_OR_EQUAL_OPERATOR
            - LESS_THAN_OR_EQUAL_OPERATOR
          trim:
            type: boolean
            description: Whether to perform whitespace removal before checking against
              the value? Default is false.
            default: false
          value:
            type: string
            description: "The value to check against. In string form. Note that this\
              \ can be {1, 2, 3} if using = as operation to check against a list.If\
              \ the term type is composite, this is not used (and uses left/right\
              \ children instead)."
    RelatedRecordCriteriaPojo:
      type: object
      properties:
        relatedRecordId:
          type: integer
          description: "Used together with query restriction. If query restriction\
            \ is not QUERY_ALL, then this is the record ID to check against."
          format: int64
        relatedRecordType:
          type: string
          description: Used in conjunction with related record ID and query restriction.
            Specifies the data type name of relatedRecordId
        queryRestriction:
          type: string
          description: "Should the report's initial retrieval of records based off\
            \ of a particular record? If so, what is the relation of the results to\
            \ this record? Default is not to restrict (QUERY_ALL)."
          enum:
          - QUERY_ALL
          - QUERY_CHILDREN
          - QUERY_PARENTS
          - QUERY_DESCENDANTS
          - QUERY_ANCESTORS
      description: Describes additional criteria that the report's data must be related
        somehow to a single record. This is optional.
    ReportColumnPojo:
      type: object
      properties:
        dataTypeName:
          type: string
          description: The data type name of the report column.
        dataFieldName:
          type: string
          description: The data field name of the report column.
        fieldType:
          type: string
          description: The type of this data field.
          enum:
          - BOOLEAN
          - DOUBLE
          - ENUM
          - LONG
          - INTEGER
          - SHORT
          - STRING
          - DATE
          - ACTION
          - SELECTION
          - PARENTLINK
          - IDENTIFIER
          - PICKLIST
          - LINK
          - MULTIPARENTLINK
          - CHILDLINK
          - AUTO_ACCESSION
          - DATE_RANGE
          - SIDE_LINK
          - ACTION_STRING
          - FILE_BLOB
        sortOrder:
          type: integer
          description: "The sorting priority among columns in a report, if this column\
            \ is sorting."
          format: int32
        sortDirection:
          type: string
          description: The sort direction of this report column.
          enum:
          - NONE
          - ASCENDING
          - DESCENDING
        groupBy:
          type: boolean
          description: Is this a grouping column?
        formulaCriteria:
          $ref: "#/components/schemas/FormulaCriteriaPojo"
      description: Describes a column that would should up in a result of custom report.
    ReportFieldPojo:
      type: object
      properties:
        dataTypeName:
          type: string
        dataFieldName:
          type: string
    ReportTermPojo:
      type: object
      properties:
        termType:
          type: string
          description: "The type of a custom report term. RAW_TERM: you can think\
            \ of this as a leaf node in the term tree. COMPOSITE_TERM: you can think\
            \ of this as a parent of two terms. NULL_TERM: Not used anymore."
          enum:
          - RAW_TERM
          - JOIN_TERM
          - COMPOSITE_TERM
          - NULL_TERM
        negated:
          type: boolean
          description: Whether to return result if the condition is false instead
            of is true.
          default: false
      description: Condition to satisfy for a row to show up. Terms need to be structured
        as a single tree per report.
      discriminator:
        propertyName: termType
        mapping:
          RAW_TERM: "#/components/schemas/RawReportTermPojo"
          JOIN_TERM: "#/components/schemas/FieldCompareReportTermPojo"
          COMPOSITE_TERM: "#/components/schemas/CompositeReportTermPojo"
    ScanToSelectCriteriaPojo:
