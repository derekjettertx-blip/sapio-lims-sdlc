            type: array
            items:
              $ref: "#/components/schemas/SankeyLinkWeightPojo"
    SankeyLinkPojo:
      type: object
      properties:
        columnIdx:
          type: integer
          format: int32
        fromValue:
          type: object
        toValue:
          type: object
    SankeyLinkWeightPojo:
      type: object
      properties:
        link:
          $ref: "#/components/schemas/SankeyLinkPojo"
        weight:
          type: integer
          format: int64
    StaticTextEntryDataContextPojo:
      type: object
      description: An entry data context object that backs a static text entry that
        will display a block of text in the Report PDF.
      allOf:
      - $ref: "#/components/schemas/ReportEntryDataContextPojo"
      - type: object
        properties:
          dataTypeName:
            type: string
            description: "The data type name of the record that will be used to get\
              \ the static text to display. \nThis value cannot be modified.  This\
              \ field is just to provide information about how the entry is configured\
              \ in the system.  This value must be set in order to set the dataRecordId\
              \ attribute.  If the staticHtml attribute is specified, then this value\
              \ will be ignored."
          dataFieldName:
            type: string
            description: "The data field name that the text value will be retrieved\
              \ from on the dataTypeName. \nThis value cannot be modified.  This field\
              \ is just to provide information about how the entry is configured in\
              \ the system.  This value must be set in order to set the dataRecordId\
              \ attribute.  If the staticHtml attribute is specified, then this value\
              \ will be ignored."
          dataRecordId:
            type: integer
            description: |-
              The record ID of the data record that the static text will be retrieved from.
              If the staticHtml attribute is specified, then this value will be ignored.
            format: int64
          staticHtml:
            type: string
            description: |-
              The static HTML text that will be displayed on this text entry.
              This value will take precedence of the data record Id if both are specified.
    TableEntryDataContextPojo:
      type: object
      description: An entry data context object that backs a date entry that will
        display a date in the Report PDF.
      allOf:
      - $ref: "#/components/schemas/ReportEntryDataContextPojo"
      - type: object
        properties:
          dataTypeName:
            type: string
            description: |-
              The data type that is displayed on this entry for which data needs to be retrieved.
              This value cannot be modified.  This field is just to provide information about how the entry is configured in the system.
          recordIds:
            uniqueItems: true
            type: array
            description: The set of record IDs that the table data will be retrieved
              from.
            items:
              type: integer
              description: The set of record IDs that the table data will be retrieved
                from.
              format: int64
    XyChartDataSeriesValuePojo:
      type: object
      allOf:
      - $ref: "#/components/schemas/ChartDataSeriesValuePojo"
      - type: object
        properties:
          x:
            type: number
            format: double
          "y":
            type: number
            format: double
          z:
            type: number
            format: double
          recIdsOfMatchingRows:
            uniqueItems: true
            type: array
            items:
              type: object
              additionalProperties:
                type: integer
                format: int64
    chartDataSourcePojo:
      type: object
      properties:
        axisTicks:
          type: array
          items:
            $ref: "#/components/schemas/ChartDataAxisTickPojo"
        seriesKeys:
          type: array
          items:
            $ref: "#/components/schemas/ChartDataSeriesKeyPojo"
      description: Details about the data source specified for the chart backing this
        entry.
    ReportEntryInfoPojo:
      required:
      - entryId
      - entryName
      - entryType
      type: object
      properties:
        entryId:
          type: string
          description: The identifier of the Report Entry.
        entryName:
          type: string
          description: The name of the Report Entry.
        entryType:
          type: string
          description: The type of the Report Entry.  The type of ReportEntryDataContextPojo
            specified on this entry is dependent on this value.
          enum:
          - TABLE_VIEW
          - FORM_VIEW
          - DASHBOARD
          - IMAGE
          - STATIC_TEXT
          - PAGE_NUMBERER
          - DATE
          - PLUGIN
        entryDataContextPojo:
          $ref: "#/components/schemas/ReportEntryDataContextPojo"
      description: Details about a Report Entry contained within a Report Template
        in the system.  These objects can be used to determine the entries in a template
        when providing data in a ReportDataContextPojo to generate a PDF.
    ReportTemplateInfoPojo:
      required:
      - templateId
      - templateName
      type: object
      properties:
        templateId:
          type: string
          description: The identifier of the Report Template.
        templateName:
          type: string
          description: The name of the Report Template.
        category:
          type: string
          description: User provided categories specified on the Report Template.
          nullable: true
        description:
          type: string
          description: A description of this Report Template.  This attribute contains
            additional user provided details about the Report Template.
          nullable: true
        createdBy:
          type: string
          description: The username of the user that created this Report Template.
        dateCreated:
          type: integer
          description: The timestamp in milliseconds since Unix Epoch when this Report
            Template was created.
          format: int64
        lastModifiedBy:
          type: string
          description: The username of the user that modified this Report Template
            most recently.
        dateLastModified:
          type: integer
          description: The timestamp in milliseconds since Unix Epoch when this Report
            Template was last modified.
          format: int64
      description: Details about a Report Template in the system.  These objects can
        be used to generate PDFs in the system provided some additional data context.
    SessionInfoPojo:
      type: object
      properties:
        sessionId:
          type: string
        userName:
          type: string
      description: An object containing the info of a single online user session.
    AuditLogEntryPojo:
      type: object
      properties:
        dataTypeName:
          type: string
          description: The data type name of the record associated with this audit
            log entry.
        recordId:
          type: integer
          description: The record ID of the record associated with this audit log
            entry.
          format: int64
        dataRecordName:
          type: string
          description: The name of the record associated with this audit log entry.
        description:
          type: string
          description: A description of the audit log entry.
      description: An object containing the info of a single audit log entry to be
        inserted.
    VeloxLogMessagePojo:
      type: object
      properties:
        logLevel:
          type: string
          enum:
          - ERROR
          - WARNING
          - INFO
        originatingClass:
          type: string
        message:
          type: string
          description: The message to be sent.
      description: An object representing a message that should be appended to the
        log
    UserSessionAdditionalData:
      type: object
      properties:
        currentGroupId:
          type: integer
          description: The logged in group ID of the current user session.This can
            be null if the user do not belong to any groups.
          format: int32
        currentGroupName:
          type: string
          description: The logged in group name of the current user session.This can
            be null if the user do not belong to any groups.
        firstName:
          type: string
          description: The first name of the user. This may be blank.
        middleName:
          type: string
          description: The middle name of the user. This may be blank.
        lastName:
          type: string
          description: The last name of the user. This may be blank.
        email:
          type: string
          description: The email address of the user. This may be blank.
        utcOffsetSeconds:
          type: integer
          description: "The UTC offset seconds from the current logged in session.\
            \ If this is from webhooks, then it is decided by end user's browser time\
            \ zone."
          format: int32
        timeZoneId:
          type: string
          description: "The time zone ID of the current logged in session. If this\
            \ is from webhooks, then it is decided by end user's browser time zone."
      description: "The session info for the current session. This is not necessary\
        \ to establish connection from client to server,  but can provide useful info\
        \ for a webservice user program."
    UserGroupInfoPojo:
      type: object
      properties:
        userGroupId:
          type: integer
          format: int32
        userGroupName:
          type: string
        clientPluginPath:
          type: string
        limitedUserTypeName:
          type: string
        dataTypeLayoutMap:
          type: object
          additionalProperties:
            type: string
            description: The name of the data type layouts this group is assigned
              to keyed by the data type name they are associated with.
          description: The name of the data type layouts this group is assigned to
            keyed by the data type name they are associated with.
        homepageLayoutName:
          type: string
          description: The name of the homepage layout for this user group.
        default:
          type: boolean
      description: Includes metadata of a User Group.
    RemoteWorkerBootstrapPojo:
      type: object
      properties:
        appId:
          type: string
        javaVersion:
          type: string
        javaRuntimeVersion:
          type: string
        featureJavaVersion:
          type: integer
          format: int32
        workerClasspathManifestChecksums:
          type: object
          additionalProperties:
            type: string
        rmiIpList:
          type: array
          items:
            $ref: "#/components/schemas/RemoteWorkerHostAndPort"
    RemoteWorkerHostAndPort:
      type: object
      properties:
        host:
          type: string
        port:
          type: integer
          format: int32
  responses:
    BadRequest:
      description: "A request could not be processed. Please check your connection\
        \ URL, headers and parameters."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Failed to authenticate user. Check your user name and password.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The requested resource could not be found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServerError:
      description: Internal server error occurred. Contact Sapio administrator.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServerUnavailable:
      description: The Sapio server is unavailable. Connection failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidParam:
      description: Missing parameters or parameters do not meet expectations.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  securitySchemes:
    ApiToken:
      type: apiKey
      description: API Token that can be generated from the Web Service API Key section
        in the Configuration Manager within the App Setup area.  This should be provided
        to the endpoint as a request header.
      name: X-API-TOKEN
      in: header
    BasicAuth:
      type: http
      description: Username and password base64 encoded.
      scheme: basic
    Bearer:
      type: http
      description: "If you are using OpenID Connect (OIDC) as your single sign-on\
        \ solution for the Sapio web client, you can authenticate with the Sapio web\
        \ service using an OIDC bearer token. Ensure the Issuer and Audience in the\
        \ API Integration section of the OpenID Connect Settings tab match those used\
        \ by the bearer token."
      scheme: bearer
