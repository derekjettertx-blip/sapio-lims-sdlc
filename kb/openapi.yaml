            negative Record IDs.
          items:
            $ref: "#/components/schemas/DataRecordPojo"
        recordsDeleted:
          type: array
          description: Existing records that are to be deleted by this request.
          items:
            $ref: "#/components/schemas/DataRecordDescriptor"
