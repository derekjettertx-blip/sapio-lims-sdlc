    CustomReportCriteriaPojo:
      type: object
      properties:
        columnList:
          type: array
          description: "The list of columns in the output of this report. When results\
            \ are returned, the 2nd dimension shall be in this order."
          items:
            $ref: "#/components/schemas/ReportColumnPojo"
        rootTerm:
          $ref: "#/components/schemas/ReportTermPojo"
        relatedRecordCriteria:
          $ref: "#/components/schemas/RelatedRecordCriteriaPojo"
        rootDataType:
          type: string
          description: Only required when the path is ambiguous. Specifies the highest
            ancestor data type name.
        caseSensitive:
          type: boolean
          description: "When searching texts, should the search be case sensitive?"
        pageSize:
          type: integer
          description: "The page size of the custom report. Note: if this is specified\
            \ in criteria, when running the server may further restrict this down\
            \ to amount specified in the application license."
          format: int32
        pageNumber:
          type: integer
          description: The page number of the current report.
          format: int32
        ownerRestrictionSet:
          uniqueItems: true
          type: array
          description: Specifies to only return records if record is owned by this
            set of usernames. Applicable to role-based applications only.
          items:
            type: string
            description: Specifies to only return records if record is owned by this
              set of usernames. Applicable to role-based applications only.
        joinList:
          type: array
          description: "The list of explicit joins defined on this custom report pojo.\
            \  These joins can specify data types that are unrelated to the other\
            \ types in the query.  However, the data types must exist and the columns\
            \ referenced must exist.  When adding these joins a report term must be\
            \ specified restricting a field from the joined type 'Equal To' a field\
            \ on a type that is already referenced in the custom report pojo.  That\
            \ existing type could be from a join specified previously in the list\
            \ of joins or a data type in the column or term list that is not defined\
            \ in the join list.  Data types specified in this list of joins can be\
            \ added to the list of columns and terms of the custom report."
          items:
            $ref: "#/components/schemas/ExplicitJoinDefinitionPojo"
        pivotCriteria:
          $ref: "#/components/schemas/PivotCriteriaPojo"
        useReadReplica:
          type: boolean
          description: Whether to use the read replica for this report if available.
