        type:
          type: string
          description: The type of the response
        content:
          type: array
          description: List of content generated by the LLM
          items:
            $ref: "#/components/schemas/LlmContent"
        errorString:
          type: string
          description: Error message if the request failed or encountered issues
      description: Output response from an LLM chat interaction
    LlmContent:
      type: object
      properties:
        text:
          type: string
          description: The text content
      description: A content block within an LLM response
    DisplayPopupRequest:
      type: object
      properties:
        title:
          type: string
          description: The title of the popup.
        message:
          type: string
          description: The message to display in the popup.
        popupType:
          type: string
          description: The types of popup that can be diplayed by the client through
            the Display Popup endpoint.
          enum:
          - Success
          - Info
          - Warning
          - Error
      description: Request to display a popup to the user.
    AttachmentDataSourcePojo:
      type: object
      description: A data source for attachment data in text components.
      allOf:
      - $ref: "#/components/schemas/TextDataSourcePojo"
    AttachmentPreviewComponent:
      required:
      - column
      - columnSpan
      - componentName
      - order
      type: object
      description: A component that displays the content preview of an attachment.
        Some file types are not supported.
      allOf:
      - $ref: "#/components/schemas/DataTypeComponentPojo"
      - type: object
        properties:
          previewDisplayType:
            type: string
            description: What is the size the content in this component.
            enum:
            - CONTAIN
            - COVER
            - INITIAL
    CalendarAllRecordsOfTypeDataSourcePojo:
      type: object
      description: Calendar data source that says this component will display calendar
        data of all records of the same data type in this view.
      allOf:
      - $ref: "#/components/schemas/CalendarDataSourceBasePojo"
    CalendarComponentPojo:
      required:
      - column
      - columnSpan
      - componentName
      - order
      type: object
      description: Data type component that displays a calendar view.
      allOf:
      - $ref: "#/components/schemas/DataTypeComponentPojo"
      - type: object
        properties:
          hideToolbar:
            type: boolean
            description: Whether or not to hide the toolbar that is displayed on the
              calendar component.
          calendarDataSources:
            uniqueItems: true
            type: array
            description: A collection of data sources used to gather the data to back
              the calendar component.
            items:
              $ref: "#/components/schemas/CalendarDataSourceBasePojo"
          calendarView:
            type: string
            description: The default view of the calendar when it is first opened.
            enum:
            - MONTH
            - WEEK
            - DAY
            - LIST_DAY
            - LIST_WEEK
          calendarDefaultStartTime:
            type: integer
            description: The default start time that is used when displaying the component.
              The component will be displayed starting with this time of day.
            format: int64
          showIntegratedCalendarEvents:
            type: boolean
    CalendarDataSourceBasePojo:
      type: object
      properties:
        dataTypeName:
          type: string
          description: The data type name that this data source is providing.
        dataFieldName:
          type: string
          description: The data field name from provided data type name.
        endDateFieldName:
          type: string
          description: The end date to use with the calendar.  This field is only
            needed to provide a range when the primary dataFieldName is a Date instead
            of a DateRange field.
        dataSourceType:
          type: string
          enum:
          - Search
          - All Records of Type
      description: A calendar component that shows in a data type layout.
      discriminator:
        propertyName: dataSourceType
        mapping:
          ALL_RECS_OF_TYPE: "#/components/schemas/CalendarAllRecordsOfTypeDataSourcePojo"
          REPORT: "#/components/schemas/CalendarReportDataSourcePojo"
    CalendarDetailsPojo:
      type: object
      allOf:
      - $ref: "#/components/schemas/ViewDetailsPojo"
      - type: object
        properties:
          calendarView:
            type: string
            enum:
            - MONTH
            - WEEK
            - DAY
            - LIST_DAY
            - LIST_WEEK
          startTime:
            type: integer
            format: int64
    CalendarReportDataSourcePojo:
      type: object
      allOf:
      - $ref: "#/components/schemas/CalendarDataSourceBasePojo"
      - type: object
        properties:
          reportName:
            type: string
            description: The name of the predefined search to use with this data source.
          queryRestriction:
            type: string
            description: The type of query restriction to apply to this query.  This
              only applies to components on DataTypeLayoutPojos.This is how to find
              the data from the source record that the layout is displayed on.
            enum:
            - Ancestor
            - Descendant
            - Parent
            - Child
    ClientPluginComponentPojo:
      required:
      - column
      - columnSpan
      - componentName
      - order
      - pluginPath
      type: object
      description: A component that runs a view from a client side plugin.
      allOf:
      - $ref: "#/components/schemas/DataTypeComponentPojo"
      - type: object
        properties:
          pluginPath:
            type: string
            description: The fully qualified plugin pass that will be executed to
              render this component.
          pluginComponentAttributes:
            type: object
            additionalProperties:
              type: string
              description: "Any additional attributes for this plugin component, sent\
                \ to the plugin."
            description: "Any additional attributes for this plugin component, sent\
              \ to the plugin."
    DashboardComponentPojo:
      required:
      - column
      - columnSpan
      - componentName
      - order
      type: object
      description: A data type component that shows a chart (dashboard)
      allOf:
      - $ref: "#/components/schemas/DataTypeComponentPojo"
      - type: object
        properties:
          dashboardRelationType:
            type: string
            description: How the data inside the dashboard is related to the current
              record.
            enum:
            - Ancestor
            - Descendant
            - Parent
            - Child
          dashboardDataTypeName:
            type: string
            description: Data type name of the data source.
          dashboardDefinitionGuid:
            type: string
            description: The guid of the dashboard this component is associated with.
          customReportName:
            type: string
            description: The name of the custom report backing the chart.
          showChartTitleInHeader:
            type: boolean
    DataFieldDescriptorPojo:
      type: object
      properties:
        dataTypeName:
          type: string
        dataFieldName:
          type: string
    DataFieldTextDataSourcePojo:
      type: object
      description: A Text Data Source that is a reference to a Data Field
      allOf:
      - $ref: "#/components/schemas/TextDataSourcePojo"
      - type: object
        properties:
          dataFieldName:
            type: string
            description: The name of the Data Field to use as a Text Data Source
    DataFormComponentPojo:
      required:
      - column
      - columnSpan
      - componentName
      - fieldDefinitionPositionMap
      - order
      type: object
      description: A data form within a tab of a data type layour or a temporary data
        type layout.
      allOf:
      - $ref: "#/components/schemas/DataTypeComponentPojo"
      - type: object
        properties:
          fieldDefinitionPositionMap:
            type: object
            additionalProperties:
              $ref: "#/components/schemas/FieldDefinitionPositionPojo"
            description: All fields that will show up in this form will have their
              component layout details described here.
    DataRecordDialogRequest:
      required:
      - dataRecordPojo
      - initiallyMinimalView
      - title
      type: object
      properties:
        callbackContextData:
          type: string
        title:
          type: string
          description: The title of the dialog to be displayed to the user.
        dataRecordPojo:
          $ref: "#/components/schemas/DataRecordPojo"
        dataTypeLayoutPojo:
          $ref: "#/components/schemas/DataTypeLayoutPojo"
        initiallyMinimalView:
          type: boolean
          description: "If true, then the dialog will only show key fields and required\
            \ fields initially until the expand button is clicked (similar to when\
            \ using the build in add buttons to create new records)."
        formAccessLevel:
          type: string
          description: "The level of access that the user will have on this field\
            \ entry dialog.  This attribute determines whether the user will be able\
            \ to edit the fields in the dialog, use core features, or use toolbar\
            \ plugins.  If this is not provided, then the dialog will be fully editable\
            \ based on the data type definition backing the record.  All core features\
            \ will be available to use and all plugins provided in the pluginPathList\
            \ will be available on the toolbars displayed on the layout."
          nullable: true
          enum:
          - EDITABLE
          - NOT_EDITABLE
          - READ_ONLY
        pluginPathList:
          type: array
          description: "A white list of plugins that should be displayed in the dialog.\
            \  If a plugin path is supposed to display on the provided data record\
            \ layout but is not in the list, then the plugin will not be available\
            \ in the dialog.  This white list includes plugins that would be displayed\
            \ on sub tables in the layout."
          nullable: true
          items:
            type: string
            description: "A white list of plugins that should be displayed in the\
              \ dialog.  If a plugin path is supposed to display on the provided data\
              \ record layout but is not in the list, then the plugin will not be\
              \ available in the dialog.  This white list includes plugins that would\
              \ be displayed on sub tables in the layout."
            nullable: true
        widthInPixels:
          type: integer
          description: The width of the input dialog in pixels.
          format: int32
          nullable: true
        widthPercentage:
          type: number
          description: "The width of the input dialog as a percentage of the screen\
            \ width. If pixel width is set, this will be ignored."
          format: float
          nullable: true
        callbackType:
          type: string
          enum:
          - FILE_PROMPT
          - MULTI_FILE_PROMPT
          - WRITE_FILE
          - DATA_RECORD_SELECTION
          - TABLE_ENTRY_DIALOG
          - FORM_ENTRY_DIALOG
          - LIST_DIALOG
          - OPTION_DIALOG
          - INPUT_SELECTION
          - DATA_RECORD_DIALOG
      description: Requests the current context's user to display a client callback
        showing the user a data record layout that can be used to either view the
        record or modify it.
    DataRecordPojo:
      required:
      - dataTypeName
      - fields
      type: object
      properties:
        dataTypeName:
          type: string
          description: The name of the data type that this record instance represents.
          example: ExampleType
        recordId:
          type: integer
          description: The global identifier in the system for this record instance.
          format: int64
          nullable: true
          example: 1234
        fields:
          $ref: "#/components/schemas/FieldMap"
        deleted:
          type: boolean
        new:
          type: boolean
      description: Serializable representation of a DataRecord that can be passed
        as a parameter or result of a Web Service endpoint to provide information
        relevant to a given record.
    DataTypeComponentPojo:
      required:
      - column
      - columnSpan
      - componentName
      - order
      type: object
      properties:
        componentName:
          type: string
          description: The ID of the component. Must be unique.
          default: Untitled
        displayName:
          type: string
          description: The display name of the component. Should be non-blank.
          nullable: true
          default: Untitled
        description:
          type: string
          description: Description of this component in data designer.
        parentTabName:
          type: string
          description: Name of the parent tab.
        order:
          type: integer
          description: Order of this component over all components in the parent tab.
          format: int32
          default: 0
        column:
          type: integer
          description: The column index this component starts at.
          format: int32
          default: 0
        columnSpan:
          type: integer
          description: The length of this component in number of columns.
          format: int32
          default: 4
        height:
          type: integer
          description: The height in pixels of this component.
          format: int32
          default: 200
        hideHeading:
          type: boolean
          description: Whether to hide the header.
          default: false
        componentTag:
          type: string
          description: The tag of the component. Usually used to drive plugins.
          nullable: true
        skipDataRecordUpdates:
          type: boolean
          description: Whether this component should update when data record updates
            for changes made to records of data types referenced by this component.
            This is used to prevent unnecessary processing and database queries when
            simply looking at the component in a layout.
          default: false
        collapsed:
          type: boolean
        hideHeaderIcon:
          type: boolean
        hideIfNoData:
          type: boolean
        active:
          type: boolean
        layoutComponentType:
          type: string
          enum:
          - FORM_COMPONENT
          - TAB_COMPONENT
          - ATTACHMENT_PREVIEW_COMPONENT
          - RECORD_IMAGE_COMPONENT
          - CLIENT_PLUGIN_COMPONENT
          - TEMP_DATA_COMPONENT
          - DASHBOARD_COMPONENT
          - PROCESS_VIEW_COMPONENT
          - CALENDAR_COMPONENT
          - FEED_COMPONENT
          - NEWS_FEED_COMPONENT
          - HIERARCHY_COMPONENT
          - RELATED_RECORDS_COMPONENT
          - RELATED_SIDE_LINK_COMPONENT
          - RELATED_NOTEBOOK_EXPERIMENTS
          - SEARCH_COMPONENT
          - TEXT_COMPONENT
          - PLAN_STATUS_VIEW_COMPONENT
          - STEP_OUTPUT_COMPONENT
          - LINK_PANEL_COMPONENT
      description: A component within an outer data type tab layout.
      discriminator:
        propertyName: layoutComponentType
        mapping:
          FORM_COMPONENT: "#/components/schemas/DataFormComponentPojo"
          TAB_COMPONENT: "#/components/schemas/DataTypeTabComponentPojo"
          ATTACHMENT_PREVIEW_COMPONENT: "#/components/schemas/AttachmentPreviewComponent"
          CLIENT_PLUGIN_COMPONENT: "#/components/schemas/ClientPluginComponentPojo"
          TEMP_DATA_COMPONENT: "#/components/schemas/TemporaryDataComponentPojo"
          DASHBOARD_COMPONENT: "#/components/schemas/DashboardComponentPojo"
          PROCESS_VIEW_COMPONENT: "#/components/schemas/ProcessViewComponentPojo"
          CALENDAR_COMPONENT: "#/components/schemas/CalendarComponentPojo"
          HIERARCHY_COMPONENT: "#/components/schemas/HierarchyComponentPojo"
          FEED_COMPONENT: "#/components/schemas/DataTypeFeedComponentPojo"
          NEWS_FEED_COMPONENT: "#/components/schemas/DataTypeNewsFeedComponentPojo"
          RELATED_RECORDS_COMPONENT: "#/components/schemas/RelatedRecordLayoutComponentPojo"
          SEARCH_COMPONENT: "#/components/schemas/SearchLayoutComponentPojo"
          RELATED_NOTEBOOK_EXPERIMENTS: "#/components/schemas/RelatedNotebookExperimentComponentPojo"
          RELATED_SIDE_LINK_COMPONENT: "#/components/schemas/RelatedSideLinkLayoutComponentPojo"
          RECORD_IMAGE_COMPONENT: "#/components/schemas/RecordImageComponentPojo"
          PLAN_STATUS_VIEW_COMPONENT: "#/components/schemas/PlanStatusViewComponentPojo"
          TEXT_COMPONENT: "#/components/schemas/TextComponentPojo"
          STEP_OUTPUT_COMPONENT: "#/components/schemas/StepOutputComponentPojo"
          LINK_PANEL_COMPONENT: "#/components/schemas/LinkPanelComponentPojo"
    DataTypeComponentTabDefinitionPojo:
      required:
      - layoutComponent
      - tabName
      type: object
      properties:
        tabName:
          type: string
          description: The tab name. This should match the map's key. Unique within
            the tab component.
        tabDisplayName:
          type: string
          description: The tab's display name.
        tabOrder:
          type: integer
          description: The order of this tab.
          format: int32
        layoutComponent:
          $ref: "#/components/schemas/DataTypeComponentPojo"
      description: Defines what is within this tab.
    DataTypeFeedComponentPojo:
      required:
      - column
      - columnSpan
      - componentName
      - order
      type: object
      description: Data Type Layout component used to display feed information.
      allOf:
      - $ref: "#/components/schemas/DataTypeComponentPojo"
      - type: object
        properties:
          descendantNameSet:
            uniqueItems: true
            type: array
            description: "The set of descendant data type names that will be displayed\
              \ in the feed in addition to the current type. This will retrieve descendant\
              \ record modifications, but will not show comments for descendant types."
            items:
              type: string
              description: "The set of descendant data type names that will be displayed\
                \ in the feed in addition to the current type. This will retrieve\
                \ descendant record modifications, but will not show comments for\
                \ descendant types."
    DataTypeLayoutPojo:
      type: object
      properties:
        layoutName:
          type: string
          description: Name of the layout. Unique within a data type.
        displayName:
          type: string
          description: Display name of the layout. This shows up in web client layout
            pickers (in data designer).
        description:
          type: string
          description: The detailed describtion about the layout. Usually only visible
            to admins.
        numberOfColumns:
          type: integer
          description: "The total number of columns this layout has. If 4, then column\
            \ positions can be 0,1,2,3 for each component."
          format: int32
          default: 4
        dataTypeName:
          type: string
          description: The data type name this layout is made for.
        dataTypeTabDefinitionMap:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/DataTypeTabDefinitionPojo"
          description: "The outer tabs within this layout, which includes all components\
            \ in this layout recursively."
        hiddenDataTypeNameSet:
          uniqueItems: true
          type: array
          description: Set of data types that will not show in links panel. Default
            is blank set.
          items:
            type: string
            description: Set of data types that will not show in links panel. Default
              is blank set.
        alwaysShownDataTypeNameSet:
          uniqueItems: true
          type: array
          description: "Set of data types that will always show in links panel, even\
            \ if there are no records related to this. Default is blank set"
          items:
            type: string
            description: "Set of data types that will always show in links panel,\
              \ even if there are no records related to this. Default is blank set"
        tableLayout:
          $ref: "#/components/schemas/TableLayoutPojo"
        linkPanelHidden:
          type: boolean
        fillView:
          type: boolean
        defaultLayout:
          type: boolean
        hideKeyFields:
          type: boolean
      description: Describes a single data type layout.
    DataTypeNewsFeedComponentPojo:
      required:
      - column
      - columnSpan
      - componentName
      - order
      type: object
      description: Data Type Layout component used to display a news feed information.
      allOf:
      - $ref: "#/components/schemas/DataTypeComponentPojo"
      - type: object
        properties:
          dataTypeName:
            type: string
            description: The data type that the specified field is on.  If this value
              is null then the system will assume that the field is on the type that
              the layout exists on.
            nullable: true
          relationType:
            type: string
            description: "How the provided data type is related to the data type the\
              \ layout is on.  If the dataTypeName is specified, then this attribute\
              \ must be specified.  This attribute will be ignored if the dataTypeName\
              \ is not specified."
            nullable: true
            enum:
            - Ancestor
            - Descendant
            - Parent
            - Child
          dataFieldName:
            type: string
            description: The data field name that will be used as the search value
              for the news feed.
    DataTypeTabComponentPojo:
      required:
      - column
      - columnSpan
      - componentName
      - order
      type: object
      description: A tab component. This is distinct from the outer tab component.
        This cannot be used as a direct tab from layout and need to be contained in
        an outer tab.
      allOf:
      - $ref: "#/components/schemas/DataTypeComponentPojo"
      - type: object
        properties:
          tabLayoutDefinitionMap:
            type: object
            additionalProperties:
              $ref: "#/components/schemas/DataTypeComponentTabDefinitionPojo"
            description: Map from upper-cased tab name to their tabbed component object
              data.
    DataTypeTabDefinitionPojo:
      required:
      - tabDisplayName
      - tabName
      type: object
      properties:
        layoutComponentMap:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/DataTypeComponentPojo"
          description: The layout components in this tab. Default is blank. Cannot
            be null but not required (but it is useless if no data).
        tabName:
          type: string
          description: Name of the tab that identifies this tab in layout.
        tabDisplayName:
          type: string
          description: Display name of the tab that shows up in tab browser.
        tabOrder:
          type: integer
          description: The order of this tab among tabs.
          format: int32
          nullable: true
      description: This represents the outer tab of a data type layout.
    FieldDefinitionPositionPojo:
      required:
      - dataFieldName
      type: object
      properties:
        formName:
          type: string
          description: The name of the form for this position.
          nullable: true
        dataFieldName:
          type: string
          description: The data field name of this position.
        order:
          type: integer
          description: The order of the field in the form.
          format: int32
          nullable: true
        formColumn:
          type: integer
          description: The column position this form starts at.
          format: int32
          nullable: true
        formColumnSpan:
          type: integer
          description: Length of this form column in number of columns.
          format: int32
          nullable: true
        fieldHeight:
          type: integer
          description: The height of the field to be displayed in the layout. If this
            value is set to null then the client will generate a value based on the
            VeloxStringFieldDefinition.getNumLines() value. This value will only be
            used for String fields and Selection List fields.
          format: int32
          nullable: true
      description: Position of a field within a form component. The field definition
        also needs to be on the data type.
    FormCyclerDetailsPojo:
      type: object
      allOf:
      - $ref: "#/components/schemas/ViewDetailsPojo"
