          items:
            $ref: "#/components/schemas/ReportColumnPojo"
        rootTerm:
          $ref: "#/components/schemas/ReportTermPojo"
        relatedRecordCriteria:
          $ref: "#/components/schemas/RelatedRecordCriteriaPojo"
        rootDataType:
          type: string
          description: Only required when the path is ambiguous. Specifies the highest
            ancestor data type name.
        caseSensitive:
          type: boolean
          description: "When searching texts, should the search be case sensitive?"
        pageSize:
          type: integer
          description: "The page size of the custom report. Note: if this is specified\
            \ in criteria, when running the server may further restrict this down\
            \ to amount specified in the application license."
          format: int32
        pageNumber:
          type: integer
          description: The page number of the current report.
          format: int32
        ownerRestrictionSet:
          uniqueItems: true
          type: array
          description: Specifies to only return records if record is owned by this
            set of usernames. Applicable to role-based applications only.
          items:
            type: string
            description: Specifies to only return records if record is owned by this
              set of usernames. Applicable to role-based applications only.
        joinList:
          type: array
          description: "The list of explicit joins defined on this custom report pojo.\
            \  These joins can specify data types that are unrelated to the other\
            \ types in the query.  However, the data types must exist and the columns\
            \ referenced must exist.  When adding these joins a report term must be\
            \ specified restricting a field from the joined type 'Equal To' a field\
            \ on a type that is already referenced in the custom report pojo.  That\
            \ existing type could be from a join specified previously in the list\
            \ of joins or a data type in the column or term list that is not defined\
            \ in the join list.  Data types specified in this list of joins can be\
            \ added to the list of columns and terms of the custom report."
          items:
            $ref: "#/components/schemas/ExplicitJoinDefinitionPojo"
        pivotCriteria:
          $ref: "#/components/schemas/PivotCriteriaPojo"
        useReadReplica:
          type: boolean
          description: Whether to use the read replica for this report if available.
            If true and db replica is configured it will be used otherwise normal
            db will be used. Default is false.
        hasNextPage:
          type: boolean
          description: Does the next page have any records?
        resultTable:
          type: array
          description: "The data in the report. The first dimension is row, each row\
            \ represent a record.For each row, the column is in order of the column\
            \ list defined in this report. If the report is not ran by the server,\
            \ this can be null."
          items:
            type: array
            description: "The data in the report. The first dimension is row, each\
              \ row represent a record.For each row, the column is in order of the\
              \ column list defined in this report. If the report is not ran by the\
              \ server, this can be null."
            items:
              type: object
              description: "The data in the report. The first dimension is row, each\
                \ row represent a record.For each row, the column is in order of the\
                \ column list defined in this report. If the report is not ran by\
                \ the server, this can be null."
      description: Holds the result of a custom report. This is returned by the service
        call.
    ExplicitJoinDefinitionPojo:
      type: object
      properties:
        dataTypeName:
          type: string
          description: The name of the data type to be joined to the other data types
            referenced in the advanced search.  The report term included in this object
            much define how this type will be joined with the other types in the search.
        reportTermPojo:
          $ref: "#/components/schemas/ReportTermPojo"
      description: POJO representing a custom join defined for an advanced search
        CustomReportPojo.  This join object includes the data type name to add to
        the report as well as a ReportTermPojo defining how that data type will get
        included in the search.
    FieldCompareReportTermPojo:
      required:
      - leftDataFieldName
      - leftDataTypeName
      - rightDataFieldName
      - rightDataTypeName
      - termOperation
      type: object
      description: A field compare report term describes a comparison between two
        data fields.
      allOf:
      - $ref: "#/components/schemas/ReportTermPojo"
      - type: object
        properties:
          leftDataTypeName:
            type: string
            description: "The data type name on the left side of the term operator.\
              \ Each data type to be joined together should have at least one term,\
              \ even if there is no filter other than by join condition."
          leftDataFieldName:
            type: string
            description: The data field name on the left side of the term operator.
          termOperation:
            type: string
            description: Describes what operations can be performed on rows of data
              directly.
            enum:
            - GREATER_THAN_OPERATOR
            - LESS_THAN_OPERATOR
            - EQUAL_TO_OPERATOR
            - NOT_EQUAL_TO_OPERATOR
            - GREATER_THAN_OR_EQUAL_OPERATOR
            - LESS_THAN_OR_EQUAL_OPERATOR
          rightDataTypeName:
            type: string
            description: "The data type name on the right side of the term operator.\
              \ Each data type to be joined together should have at least one term,\
              \ even if there is no filter other than by join condition."
          rightDataFieldName:
            type: string
            description: The data field name on the right side of the term operator.
          trim:
            type: boolean
            description: Whether to perform whitespace removal before checking against
              the value? Default is false.
            default: false
    FormulaCriteriaPojo:
      type: object
      properties:
        formula:
          type: string
        precision:
          type: integer
          format: int32
        scientificNotationMinDigitsFromDecimalPoint:
          type: integer
          format: int32
      description: Criteria object for providing a formula and details about how the
        results should be displayed.
    InputSelectionRequest:
      type: object
      properties:
        callbackContextData:
          type: string
        dataTypeName:
          type: string
          description: The name of the data type to search for as input.  Only data
            records of this type will be selectable in the dialog.
        dialogMessage:
          type: string
          description: The message that will be displayed in the selection dialog.
        enabledSearchTypeSet:
          type: array
          description: The type of search that will be made available to the user
            through the dialog.
          items:
            type: string
            description: The type of search that will be made available to the user
              through the dialog.
            enum:
            - QUICK_SEARCH
            - ADVANCED_SEARCH
            - BROWSE_TREE
        showOnlyKeyFields:
          type: boolean
          description: Whether only key fields of the selected data type should be
            displayed in the table of data in the dialog.
        recordIdBlackList:
          uniqueItems: true
          type: array
          description: Set of record IDs matching records that should not be seen
            as possible options in the dialog.
          items:
            type: integer
            description: Set of record IDs matching records that should not be seen
              as possible options in the dialog.
            format: int64
        recordIdWhiteList:
          uniqueItems: true
          type: array
          description: Set of record IDs matching records matching the only records
            that should be seen as possible options in the dialog.
          items:
            type: integer
            description: Set of record IDs matching records matching the only records
              that should be seen as possible options in the dialog.
            format: int64
        preselectedRecordIds:
          type: array
          description: The record IDs that should be selected in the dialog when it
            is initially displayed to the user.
          items:
            type: integer
            description: The record IDs that should be selected in the dialog when
              it is initially displayed to the user.
            format: int64
        customSearchPojo:
          $ref: "#/components/schemas/CustomReportPojo"
        scanToSelectCriteriaPojo:
          $ref: "#/components/schemas/ScanToSelectCriteriaPojo"
        multiSelect:
          type: boolean
          description: Whether the user can select multiple rows in the dialog.
        showCreateNewOption:
          type: boolean
          description: Whether 'Create New' button will be visible to the dialog.
        numDefaultAddNewRecords:
          maximum: 500
          minimum: 1
          type: integer
          description: "The number of records to add, when user selects 'Create New'\
            \ option in input selection. Note: this will not do anything if multi-select\
            \ is false or data type is not group addable."
          format: int32
          nullable: true
        callbackType:
          type: string
          enum:
          - FILE_PROMPT
          - MULTI_FILE_PROMPT
          - WRITE_FILE
          - DATA_RECORD_SELECTION
          - TABLE_ENTRY_DIALOG
          - FORM_ENTRY_DIALOG
          - LIST_DIALOG
          - OPTION_DIALOG
          - INPUT_SELECTION
          - DATA_RECORD_DIALOG
      description: Request to select from records of the given data type that exist
        in the system.
    PivotCriteriaPojo:
      type: object
      properties:
        groupByField:
          $ref: "#/components/schemas/ReportFieldPojo"
        columnsField:
          $ref: "#/components/schemas/ReportFieldPojo"
        valueField:
          $ref: "#/components/schemas/ReportFieldPojo"
        valueFunctionType:
          type: string
          enum:
          - Total
          - Average
          - Median
          - Maximum Value
          - Minimum Value
          - Count
