    VeloxStringFieldDefinitionPojo:
      required:
      - dataFieldName
      - dataFieldType
      type: object
      description: Field definition representing a field that can store a string value.
      allOf:
      - $ref: "#/components/schemas/VeloxFieldDefinitionPojo"
      - type: object
        properties:
          defaultValue:
            type: string
            description: The default value that will be set in this field when a new
              record is created.
          maxLength:
            type: integer
            description: The maximum number of characters that can be stored in this
              field.
            format: int32
          uniqueValue:
            type: boolean
            description: "Whether or not this field must be unique in the system.\
              \  If this field is set to true after records are already created, it\
              \ is possible for duplicate values to exist in the system.  Additionally\
              \ if no value is provided to this field when setting fields, the uniqueness\
              \ will not be validated."
          htmlEditor:
            type: boolean
            description: Whether or not this field will be able to render html markup.  The
              field will be scrubbed before it is displayed to prevent html injection.
          stringFormat:
            type: string
            description: The formatting to be used when displaying this field.  Displaying
              as a PHONE format will create a link in the browser that will link to
              the default dialer.  Displaying as an EMAIL format will create a link
              in the browser to link to the default email client.
            enum:
            - PHONE
            - EMAIL
          preservePadding:
            type: boolean
            description: Whether or not the client will preserve padding in the string
              field. If false the client will trim any values set
          numLines:
            type: integer
            description: "Number of lines of this string field. If set, a fixed height\
              \ will be rendered for this field in layouts. If auto height is off\
              \ and this is unspecified, one-line height will be rendered for this\
              \ field in layouts."
            format: int32
          autoSize:
            type: boolean
            description: Whether the string field shall be auto-sized based off of
              its content length.
          linkOut:
            type: boolean
            description: Whether this field is a link-out field.
          linkOutUrl:
            type: string
            description: The link-out URL macro that uses this field's field value
