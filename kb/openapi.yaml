        to the child extension type.
      allOf:
      - $ref: "#/components/schemas/VeloxFieldDefinitionPojo"
    VeloxDateFieldDefinitionPojo:
      required:
      - dataFieldName
      - dataFieldType
      type: object
      description: Field definition representing a field that can contain a date value.
      allOf:
      - $ref: "#/components/schemas/VeloxFieldDefinitionPojo"
      - type: object
        properties:
          dateTimeFormat:
            type: string
            description: The date time format that will be used to display the date
              set in this field in the UI.
          defaultValue:
            type: string
            description: The default value that will be set in this field when a new
              record is created.
          staticDate:
            type: boolean
            description: Whether or not this is a static date field.  The client will
              always display static date fields in the UTC timezone instead of in
              the timezone local to the users browser.
    VeloxDateRangeFieldDefinitionPojo:
      required:
      - dataFieldName
      - dataFieldType
      type: object
      description: Field definition representing a field that can contain a date range
        value.
      allOf:
      - $ref: "#/components/schemas/VeloxFieldDefinitionPojo"
      - type: object
        properties:
          dateTimeFormat:
            type: string
            description: The date time format that will be used to display the date
              set in this field in the UI.
          defaultValue:
            type: string
            description: The default value that will be set in this field when a new
              record is created.
          static:
            type: boolean
            description: Whether this field is static or not.  Static date ranges
              will not take timezones into account and will display as the same date
              in all timezones.  The values are stored and displayed relative to UTC.
    VeloxDoubleFieldDefinitionPojo:
      required:
      - dataFieldName
      - dataFieldType
      type: object
      description: Field definition representing a field that can contain a double
        value.
      allOf:
      - $ref: "#/components/schemas/VeloxFieldDefinitionPojo"
      - type: object
        properties:
          minValue:
            type: number
            description: The minimum value that can be set in this field.
            format: double
          maxValue:
            type: number
            description: The maximum value that can be set in this field.
            format: double
          defaultValue:
            type: number
            description: The default value that will be set in this field when a new
              record is created.
            format: double
          precision:
            type: integer
            description: The number of digits to be retained when storing decimal
              values.
            format: int32
          doubleFormat:
            type: string
