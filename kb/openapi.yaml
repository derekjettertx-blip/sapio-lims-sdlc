    VeloxFieldDefinitionPojo:
      required:
      - dataFieldName
      - dataFieldType
      type: object
      properties:
        dataTypeName:
          type: string
          description: The name of the data type that this field is set on.
        dataFieldType:
          type: string
          description: The type of the field.
          example: BOOLEAN
          enum:
          - BOOLEAN
          - DOUBLE
          - ENUM
          - LONG
          - INTEGER
          - SHORT
          - STRING
          - DATE
          - ACTION
          - SELECTION
          - PARENTLINK
          - IDENTIFIER
          - PICKLIST
          - LINK
          - MULTIPARENTLINK
          - CHILDLINK
          - AUTO_ACCESSION
          - DATE_RANGE
          - SIDE_LINK
          - ACTION_STRING
          - FILE_BLOB
        dataFieldName:
          type: string
          description: The name of the field.  This field name is unique on a given
            data type.
        displayName:
          type: string
          description: The name to display for this dataField.  (ie. the 'pretty'
            name)
        description:
          type: string
          description: The full description of this field to let users know what to
            enter and / or what it is used for.
        required:
          type: boolean
          description: Whether or not this field is required to have a value or can
            be left blank.
        editable:
          type: boolean
          description: Data field is editable by user through web client.
          default: true
        visible:
          type: boolean
          description: Data field is visible by user through web client.
          default: true
        identifier:
          type: boolean
          description: Specifies whether this field is an identifier for this Data
            Record type.  Identifiers are fields that are concatenated together in
            the DataRecordName field on every record.
        identifierOrder:
          type: integer
          description: "If this field is designated as an identifier, this attribute\
            \ specifies its order in among all identifier fields of this data type."
          format: int32
        sortDirection:
          type: string
          description: "The direction this field should be sorted.  If this value\
            \ is not set, no sorting will be applied to this field."
          enum:
          - Ascending
          - Descending
          - None
        sortOrder:
          type: integer
          description: "If a sort direction is specified and there are multiple sort\
            \ fields, this number will determine where this field will fall in the\
            \ order of the field sorts."
          format: int32
        tag:
          type: string
          description: An open ended string field that can be used to mark fields
            for custom functionality.
        keyField:
          type: boolean
          description: A field that is used to summarize this data type.  This field
            could be part of a group of key fields that as a group define any given
            record of this type.
        keyFieldOrder:
          type: integer
          description: "If this field is set as a key field, this value is used to\
            \ determine what order the fields are displayed."
          format: int32
        systemField:
          type: boolean
          description: If this field was created by the system.  System fields can
            not be edited through the api.
        auditLogged:
          type: boolean
          description: Whether or not value changes to this field will be tracked
            in the audit log.
        defaultTableColumnWidth:
          type: integer
          description: "The default table column width of this field to show up in\
            \ table. If default, it is 0."
          format: int32
      description: VeloxFieldDefinition representation that can be retrieved through
        the Veloxity webservice.
      discriminator:
        propertyName: dataFieldType
        mapping:
          INTEGER: "#/components/schemas/VeloxIntegerFieldDefinitionPojo"
          ENUM: "#/components/schemas/VeloxEnumFieldDefinitionPojo"
          AUTO_ACCESSION: "#/components/schemas/VeloxAccessionFieldDefinitionPojo"
          BOOLEAN: "#/components/schemas/VeloxActionFieldDefinitionPojo"
          DATE: "#/components/schemas/VeloxDateFieldDefinitionPojo"
          DATE_RANGE: "#/components/schemas/VeloxDateRangeFieldDefinitionPojo"
          DOUBLE: "#/components/schemas/VeloxDoubleFieldDefinitionPojo"
          LONG: "#/components/schemas/VeloxIdentifierFieldDefinitionPojo"
          PICKLIST: "#/components/schemas/VeloxPickListFieldDefinitionPojo"
          SELECTION: "#/components/schemas/VeloxSelectionFieldDefinitionPojo"
          SHORT: "#/components/schemas/VeloxShortFieldDefinitionPojo"
          STRING: "#/components/schemas/VeloxStringFieldDefinitionPojo"
          ACTION: "#/components/schemas/VeloxActionFieldDefinitionPojo"
          CHILDLINK: "#/components/schemas/VeloxChildLinkFieldDefinitionPojo"
          IDENTIFIER: "#/components/schemas/VeloxIdentifierFieldDefinitionPojo"
          MULTIPARENTLINK: "#/components/schemas/VeloxMultiParentFieldDefinitionPojo"
          PARENTLINK: "#/components/schemas/VeloxParentLinkFieldDefinitionPojo"
          SIDE_LINK: "#/components/schemas/VeloxSideLinkFieldDefinitionPojo"
          ACTION_STRING: "#/components/schemas/VeloxActionStringFieldDefinitionPojo"
    VeloxIdentifierFieldDefinitionPojo:
      required:
      - dataFieldName
      - dataFieldType
      type: object
      description: Field definition representing a field that can contain a Long integer
        value.
      allOf:
      - $ref: "#/components/schemas/VeloxFieldDefinitionPojo"
      - type: object
        properties:
          minValue:
            type: integer
            description: The minimum value that can be set in this field.
            format: int64
          maxValue:
            type: integer
            description: The maximum value that can be set in this field.
            format: int64
          defaultValue:
            type: integer
            description: The default value that will be set in this field when a new
              record is created.
            format: int64
          uniqueValue:
            type: boolean
            description: "Whether or not this field must be unique in the system.\
              \  If this field is set to true after records are already created, it\
              \ is possible for duplicate values to exist in the system.  Additionally\
              \ if no value is provided to this field when setting fields, the uniqueness\
              \ will not be validated."
          scientificNotationPrecision:
            type: integer
            description: "The precision of the decimal value displayed when formatted\
              \ as scientific notation. To make sure a field displays in scientific\
              \ notation, this value and setScientificNotationMinDigitsFromDecimalPoint\
              \ must not be null."
            format: int32
          scientificNotationMinDigitsFromDecimalPoint:
            type: integer
            description: "The minimum number of digits that must be set in a field\
              \ value before it is displayed as scientific notation. Both this value\
              \ and {@link #scientificNotationPrecision(Short)} must be set to display\
              \ values using scientific notation."
            format: int32
    VeloxIntegerFieldDefinitionPojo:
      required:
