components:
  schemas:
    Error:
      required:
      - code
      - message
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    FieldMap:
      type: object
      additionalProperties:
        anyOf:
        - type: string
        - type: integer
        - type: number
        - type: boolean
        - pattern: ^\d+/\d+$
          type: string
          description: String representing a DateRange field value.  This string format
            represents the start timestamp in milliseconds from epoch and the end
            timestamp in milliseconds from epoch separated by a forward slash.
      description: String -> Object map representing values set on a DataRecord.  This
        object is also commonly used to represent values that are to be set on a record
        or to create new records with the fields.
      example:
        RecordId: 1234
        ExampleField: Some Example Value
        ExampleId: ExampleId1
        DataRecordName: ExampleId1 1234
        CreatedBy: user1
        DateCreated: 1534525520336
    RelatedRecordLists:
      type: array
      description: List of Lists of DataRecordPojo objects representing related records
        to a list of records provided as a parameter.  The index of each list in this
        object will map to an index of a record provided to the endpoint.
      items:
        type: array
        items:
          $ref: "#/components/schemas/DataRecordPojo"
    ValueList:
      type: array
      example:
      - Test1
      - 2
      - 3.01
      - false
      items:
        oneOf:
        - type: string
        - type: integer
        - type: number
        - type: boolean
        - pattern: ^\d+/\d+$
          type: string
          description: String representing a DateRange field value.  This string format
            represents the start timestamp in milliseconds from epoch and the end
            timestamp in milliseconds from epoch separated by a forward slash.
    RelationMap:
      type: object
      additionalProperties:
        type: array
        items:
          $ref: "#/components/schemas/DataRecordPojo"
      description: A map from a string representation of a record in the format of
        "DataTypeName:RecordID" to an array of DataRecordPojo objects.  This map is
        used to define a an array of records and an array of arrays of records.
    RelationFieldsMap:
      type: object
      additionalProperties:
        type: array
        items:
          $ref: "#/components/schemas/FieldMap"
      description: A map from a string representation of a record in the format of
        "DataTypeName:RecordID" to an array of FieldMap objects.  This map is used
        to define a an array of records and an array of arrays of fields to create
        new related records with.
    UserGroupAssignmentMap:
      type: object
      additionalProperties:
        type: array
        items:
          $ref: "#/components/schemas/UserInfoPojo"
      description: A map from a string User Group name to an array of UserInfoPojo
        objects.  This object represents users that are assigned to each group.
    AccessionDataFieldCriteriaPojo:
      required:
      - dataFieldName
      - dataTypeName
      - sequenceKey
      type: object
      properties:
        criteriaType:
          type: string
          description: SYSTEM means the field is not tied to anything other than the
            system. DATA_FIELD means the accession is for a particular data field
            in a data type.
          enum:
          - SYSTEM
          - DATA_FIELD
        prefix:
          type: string
          description: "If specified, the value returned will have this starting text."
        suffix:
          type: string
          description: "If specified, the value returned will have this trailing text."
        sequenceKey:
          type: string
          description: "The key of the sequence. Each key holds separate cache of\
            \ values. At minimum, for requests with different prefix, suffix, data\
            \ type name, or data field name, they should have different keys."
        initialSequenceValue:
          type: integer
          description: "If there are no value at all among all records in the field,\
            \ start with this value."
          format: int64
          default: 1
        dataTypeName:
          type: string
          description: The data type name of the field
        dataFieldName:
          type: string
          description: The data field name of the field to accession. This field must
            be unique.
      description: Criteria to for accessioning using a starting value queried from
        data field in the system.
    AccessionSystemCriteriaPojo:
      required:
      - sequenceKey
      type: object
      properties:
        criteriaType:
          type: string
          description: SYSTEM means the field is not tied to anything other than the
            system. DATA_FIELD means the accession is for a particular data field
            in a data type.
          enum:
          - SYSTEM
          - DATA_FIELD
        prefix:
          type: string
          description: "If specified, the value returned will have this starting text."
        suffix:
          type: string
          description: "If specified, the value returned will have this trailing text."
        sequenceKey:
          type: string
          description: "The key of the sequence. Each key holds separate cache of\
            \ values. At minimum, for requests with different prefix, suffix, data\
            \ type name, or data field name, they should have different keys."
        initialSequenceValue:
          type: integer
          description: "If there are no value at all among all records in the field,\
            \ start with this value."
          format: int64
          default: 1
      description: Criteria to for accessioning without using a data field in a data
        type.
