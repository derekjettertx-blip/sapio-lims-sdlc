        properties:
          recordImagePlacement:
            type: string
            enum:
            - NONE
            - LEFT
            - RIGHT
          customFormFieldsToShow:
            type: array
            items:
              $ref: "#/components/schemas/DataFieldDescriptorPojo"
    HierarchyComponentPojo:
      required:
      - column
      - columnSpan
      - componentName
      - order
      type: object
      description: Component to display a hierarchy view from the data type backing
        the layout.
      allOf:
      - $ref: "#/components/schemas/DataTypeComponentPojo"
      - type: object
        properties:
          dashboardGuidList:
            type: array
            description: The list of dashboard GUIDs in order from top to bottom.
            items:
              type: string
              description: The list of dashboard GUIDs in order from top to bottom.
          defaultDashboardSize:
            type: integer
            description: "Determines how much width the default dashboard will take\
              \ up. By default, this is 50 (50%)."
            format: int32
            default: 50
          hierarchyNodeDataTypeSet:
            uniqueItems: true
            type: array
            description: The list of data types in the hierarchy from the type backing
              this layout. These are the types that will be displayed in the hierarchy
              component.  Any types not included will be filtered out.
            items:
              type: string
              description: The list of data types in the hierarchy from the type backing
                this layout. These are the types that will be displayed in the hierarchy
                component.  Any types not included will be filtered out.
          toolbarGroupFunctionBlackList:
            uniqueItems: true
            type: array
            description: The toolbar functions that are not supported on the hierarchy
              nodes.  Any functions listed in this field will not show on the node
              toolbars.
            items:
              type: string
              description: The toolbar functions that are not supported on the hierarchy
                nodes.  Any functions listed in this field will not show on the node
                toolbars.
          fieldsToShowByType:
            type: object
            additionalProperties:
              type: array
              description: The fields that should be displayed in the hierarchy nodes
                keyed by the node data type that they are to be displayed on.
              items:
                $ref: "#/components/schemas/DataFieldDescriptorPojo"
            description: The fields that should be displayed in the hierarchy nodes
              keyed by the node data type that they are to be displayed on.
    KanbanDataFieldPojo:
      type: object
      properties:
        dataTypeName:
          type: string
        dataFieldName:
          type: string
    KanbanDetailsPojo:
      type: object
