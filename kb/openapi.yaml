            type: object
            additionalProperties:
              type: integer
              description: A map from data type name to the record ID that should
                be used to retrieve the data.  The fields that should be used in this
                entry will be retrieved from the fieldMapByRecIdByType in the ReportDataContextPojo
                by using the values set in this map.
