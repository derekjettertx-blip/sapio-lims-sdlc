            format: int32
          maxValue:
            type: integer
            description: The maximum value that can be set in this field.
            format: int32
          defaultValue:
            type: integer
            description: The default value that will be set in this field when a new
              record is created.
            format: int32
          uniqueValue:
            type: boolean
            description: "Whether or not this field must be unique in the system.\
              \  If this field is set to true after records are already created, it\
              \ is possible for duplicate values to exist in the system.  Additionally\
              \ if no value is provided to this field when setting fields, the uniqueness\
              \ will not be validated."
          scientificNotationPrecision:
            type: integer
            description: "The precision of the decimal value displayed when formatted\
              \ as scientific notation. To make sure a field displays in scientific\
              \ notation, this value and setScientificNotationMinDigitsFromDecimalPoint\
              \ must not be null."
            format: int32
          scientificNotationMinDigitsFromDecimalPoint:
            type: integer
            description: "The minimum number of digits that must be set in a field\
              \ value before it is displayed as scientific notation. Both this value\
              \ and {@link #scientificNotationPrecision(Short)} must be set to display\
              \ values using scientific notation."
            format: int32
    VeloxMultiParentFieldDefinitionPojo:
      required:
      - dataFieldName
      - dataFieldType
      type: object
      description: Field definition representing a link to multiple parents of a given
        type.  These fields are automatically created by the server for relations
        where the child type can be under multiple recurds of the parent type.  Fields
        of this type cannot be added or set manually through the API.  There is no
        value backing fields of this type.  These fields are merely placeholders for
        how the fields should be laid out in the client. Fields of this type will
        be formatted as 'MultiParentLink###' where the number at the end of the string
        is the ID of the data type the field is linking to.
      allOf:
      - $ref: "#/components/schemas/VeloxFieldDefinitionPojo"
    VeloxParentLinkFieldDefinitionPojo:
      required:
      - dataFieldName
      - dataFieldType
      type: object
      description: Field definition representing a link to a single parent of a given
        type.  These fields are automatically created by the server for relations
        where the child type cannot be under many records of the given parent type.  These
        fields cannot be added or set manually through the API.  The value found in
        these fields will be the value of the DataRecordName field set on the parent
        type. Fields of this type will be formatted as 'RelatedRecord###' where the
        number at the end of the string is the ID of the data type the field is linking
        to.
      allOf:
      - $ref: "#/components/schemas/VeloxFieldDefinitionPojo"
    VeloxPickListFieldDefinitionPojo:
      required:
      - dataFieldName
      - dataFieldType
      type: object
      description: Field definition representing a field that can be backed by a configurable
        list that is defined in the system.  Fields of this type do not support having
        multiple values from the list set at the same time.
      allOf:
      - $ref: "#/components/schemas/VeloxFieldDefinitionPojo"
      - type: object
        properties:
          dependentFieldMap:
            type: object
            additionalProperties:
              uniqueItems: true
              type: array
              description: A map of field name to the field values that cause that
                dependent field to become disabled.
              items:
                type: string
                description: A map of field name to the field values that cause that
                  dependent field to become disabled.
            description: A map of field name to the field values that cause that dependent
              field to become disabled.
          defaultValue:
            type: string
            description: The default value that will be set in this field when a new
              record is created.
          pickListName:
            type: string
            description: "The name of the List Manager list that will back this pick\
              \ list field.  This field will not be restricted to these values through\
              \ the API, but can be restricted to only values from the pick list through\
              \ the client."
          directEdit:
            type: boolean
            description: Whether to allow direct edit on this field or force them
              to choose from the list.
          linkOut:
            type: boolean
            description: Indicate that this field is a link-out field.
          linkOutUrl:
            type: string
            description: Location to store the URL or list of URL's for the link out
              capability.
          fieldValidator:
            $ref: "#/components/schemas/FieldValidatorPojo"
          hideDisabledFields:
            type: boolean
    VeloxSelectionFieldDefinitionPojo:
      required:
      - dataFieldName
      - dataFieldType
      type: object
      description: "Field definition representing a field that can be backed by a\
        \ list of values to select from.  The list could be list manager list defined\
        \ in the system, an advanced search, a plugin, users defined in the system,\
        \ or user groups defined in the system.."
      allOf:
      - $ref: "#/components/schemas/VeloxFieldDefinitionPojo"
      - type: object
        properties:
          dependentFieldMap:
            type: object
            additionalProperties:
              uniqueItems: true
              type: array
              description: A map of field name to the field values that cause that
                dependent field to become disabled.
              items:
                type: string
                description: A map of field name to the field values that cause that
                  dependent field to become disabled.
            description: A map of field name to the field values that cause that dependent
              field to become disabled.
          defaultValue:
            type: string
            description: The default value that will be set in this field when a new
              record is created.
          listMode:
            type: string
            description: |-
              The mode used for populating the values backing the selection list.  This value defines whether this field is backed by a List Manager list, an Advanced Search, a selection list plugin, Users in the system, or User Groups in the system.

              The following are how to configure this field to support these different backing lists.
               * To back this field by a list manager list the value should be set to '[List]ListName' where ListName is the name of the list manager list to back the field.
               * To back this field by an advanced search the value should be set to '[Report]PredefinedSearchName' where PredefinedSearchName is the name of the search backing this list.
               * To back this field by a selection list plugin the value should be set to '[Plugin]PluginName' where PluginName is the name of the plugin providing the list values.
               * To back this field by users in the system there are a few options.
                  + '[Users]' would use all users in the system to back the list.
                  + '[Users]GroupName' would back the field with the list of users in the provided group where GroupName is the name of a group in the system.
                  + '[Users][NonApi]' would be the list with users that are not API users.
               * To back this field by user groups in the system the value would be set to '[UserGroups]'.
          autoSort:
            type: boolean
            description: Whether this list should be sorted alpha-numerically.
          directEdit:
            type: boolean
            description: Whether to allow direct edit on this field or force them
              to choose from the list.
          uniqueValue:
            type: boolean
            description: "Whether or not this field must be unique in the system.\
              \  If this field is set to true after records are already created, it\
              \ is possible for duplicate values to exist in the system.  Additionally\
              \ if no value is provided to this field when setting fields, the uniqueness\
              \ will not be validated."
          linkOut:
            type: boolean
            description: Indicate that this field is a link-out field.
          linkOutUrl:
            type: string
            description: Location to store the URL or list of URL's for the link out
              capability.
          multiSelect:
            type: boolean
            description: Whether or not this field supports multi-select.
          fieldValidator:
            $ref: "#/components/schemas/FieldValidatorPojo"
          staticListValues:
            type: array
            description: A list of static values that will back this selection field.  This
              value will not be stored in the database and will only be available
              for things like client callbacks that take field definitions or temporary
              data types. As long as this list is not empty or null the client will
              use this list instead of the listMode to populate the selection lists.
            items:
              type: string
              description: A list of static values that will back this selection field.  This
                value will not be stored in the database and will only be available
                for things like client callbacks that take field definitions or temporary
                data types. As long as this list is not empty or null the client will
                use this list instead of the listMode to populate the selection lists.
          autoSize:
            type: boolean
          hideDisabledFields:
            type: boolean
