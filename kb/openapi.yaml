          pluginComponentAttributes:
            type: object
            additionalProperties:
              type: string
              description: "Any additional attributes for this plugin component, sent\
                \ to the plugin."
            description: "Any additional attributes for this plugin component, sent\
              \ to the plugin."
          linkPanelHiddenDataTypeNames:
            uniqueItems: true
            type: array
            description: A set of data type names that should be hidden from the Link
