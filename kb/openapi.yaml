    VeloxAccessionFieldDefinitionPojo:
      required:
      - dataFieldName
      - dataFieldType
      type: object
      description: Field definition representing a field on the data type that will
        be automatically accessioned when new records of this type are created.  Fields
        of this type cannot be modified through the API.
      allOf:
      - $ref: "#/components/schemas/VeloxFieldDefinitionPojo"
      - type: object
        properties:
          uniqueValue:
            type: boolean
            description: "Whether or not this field must be unique in the system.\
              \  If this field is set to true after records are already created, it\
              \ is possible for duplicate values to exist in the system.  Additionally\
              \ if no value is provided to this field when setting fields, the uniqueness\
              \ will not be validated."
          linkOut:
            type: boolean
            description: Indicate that this field is a link-out field.
          linkOutUrl:
            type: string
            description: Location to store the URL or list of URL's for the link out
              capability.
          sequenceKey:
            type: string
            description: "The key that will be used to track the accession value for\
              \ this field.  This could map to a sequence that already exists in the\
              \ accession manager, or it could be a new key.  If this is set to null,\
              \ then a GUID will be accessioned to be used as the key for this field."
          prefix:
            type: string
            description: The prefix that will be added before the accessioned numeric
              value.
          suffix:
            type: string
            description: The suffix that will be added to the end of the accessioned
              numeric value.
          numberOfDigits:
            type: integer
            description: The minimum number of digits to include in the accessioned
              value.
            format: int32
          startingValue:
            type: integer
            description: The initial value that will be used if the sequence key is
              not found when creating a new record.  This will only be used when creating
              the first record.  The value will not be relevant if changed after the
              first value is accessioned unless a new sequenceKey is specified.
            format: int64
    VeloxActionFieldDefinitionPojo:
